name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Check bundled privacy policy
        run: python3 scripts/generate-privacy-policy.py --check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --runInBand

  android-release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Test native monetization and build release bundle
        run: cd android && ./gradlew :app:testReleaseUnitTest :app:bundleRelease
      - name: Verify 16 KB libraries and ad-free startup
        run: python3 scripts/verify-android-release.py android/app/build/outputs/bundle/release/app-release.aab
